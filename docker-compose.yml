services:
  app:
    build: .
    ports:
      - "8443:8443"
    volumes:
      - qad-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket,ssl; ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE; s=ctx.wrap_socket(socket.create_connection(('127.0.0.1',8443),3)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  qad-data:
