events {
  worker_connections 1024;
}

stream {
  # 127.0.0.11 is Docker Compose's embedded DNS. Re-resolving "app" on
  # every new connection (rather than once at nginx startup) is what lets
  # `docker compose up --scale app=N` change the backend set live, and
  # lets a killed replica drop out of rotation without an nginx reload.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 8443;
    set $backend app:8443;
    proxy_pass $backend;
    proxy_connect_timeout 3s;
    proxy_timeout 60s;
  }
}
