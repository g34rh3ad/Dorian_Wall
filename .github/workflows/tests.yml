name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # liboqs-python compiles the PQC library from source on first import
      - name: Install liboqs build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential libssl-dev

      - name: Install Python dependencies
        run: |
          pip install -r server/requirements.txt
          pip install -r client/requirements.txt

      - name: Trigger liboqs build (cached separately from pip's own cache)
        run: python3 -c "import oqs; oqs.KeyEncapsulation('ML-KEM-768')"

      - name: Build web assets
        working-directory: web
        run: |
          npm install
          mkdir -p dist
          for f in index register login admin; do
            npx esbuild src/$f.js --bundle --format=esm --target=es2020 --outfile=dist/$f-bundle.js
          done
          cp src/*.html src/styles.css dist/

      - name: Generate a self-signed TLS cert for the test run
        working-directory: server
        run: python3 gen_cert.py

      - name: Start the KMS daemon
        run: |
          python3 kms/kms_daemon.py > kms.log 2>&1 &
          echo $! > kms.pid
          for i in $(seq 1 20); do
            [ -S "$HOME/.local/share/quantum-auth-kms/kms.sock" ] && break
            sleep 0.5
          done

      - name: Start the app server
        working-directory: server
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8443 \
            --ssl-certfile certs/cert.pem --ssl-keyfile certs/key.pem \
            > ../server.log 2>&1 &
          echo $! > ../server.pid
          for i in $(seq 1 30); do
            curl -sk -o /dev/null https://127.0.0.1:8443/ && break
            sleep 0.5
          done

      - name: Run test suites
        working-directory: client
        run: |
          for t in test_auth.py test_e2e.py test_sharing.py test_security.py; do
            echo "::group::$t"
            python3 "$t"
            echo "::endgroup::"
          done

      - name: Show server logs on failure
        if: failure()
        run: |
          echo "--- server.log ---"; cat server.log || true
          echo "--- kms.log ---"; cat kms.log || true
